<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Space Dodge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a4e 100%);
            touch-action: none;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }
        
        #score {
            margin-bottom: 5px;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-family: 'Arial', sans-serif;
            z-index: 20;
        }
        
        #startScreen h1, #gameOverScreen h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #4fc3f7;
            text-shadow: 0 0 20px #4fc3f7;
        }
        
        #startScreen p, #gameOverScreen p {
            font-size: 16px;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
            color: #ccc;
        }
        
        .button {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(to bottom, #4fc3f7 0%, #2196f3 100%);
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 195, 247, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(79, 195, 247, 0.3);
        }
        
        #finalScore {
            font-size: 48px;
            color: #ffd54f;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ffd54f;
        }
        
        #highScore {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="lives">Lives: 3</div>
        </div>
        
        <div id="startScreen">
            <h1>🚀 Space Dodge</h1>
            <p>Drag to move your ship!<br>Collect stars ⭐ and avoid asteroids 🪨</p>
            <button class="button" id="startBtn">START</button>
        </div>
        
        <div id="gameOverScreen" class="hidden">
            <h1>Game Over</h1>
            <div id="finalScore">0</div>
            <div id="highScore">Best: 0</div>
            <button class="button" id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
