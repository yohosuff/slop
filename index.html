<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bee Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐝 Spelling Bee 🐝</h1>
            <p class="subtitle">Listen to the word and spell it correctly!</p>
        </header>

        <main>
            <div class="game-area">
                <div class="score-panel">
                    <div class="score-item">
                        <span class="label">Score</span>
                        <span id="score" class="value">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">Streak</span>
                        <span id="streak" class="value">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">Word</span>
                        <span id="wordNumber" class="value">1</span>
                    </div>
                </div>

                <div class="difficulty-selector">
                    <label for="difficulty">Difficulty:</label>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <div class="play-area">
                    <button id="speakBtn" class="speak-btn" title="Click to hear the word">
                        🔊 Play Word
                    </button>
                    
                    <div class="hint-container">
                        <button id="hintBtn" class="hint-btn">💡 Hint</button>
                        <span id="hint" class="hint-text"></span>
                    </div>

                    <div class="input-area">
                        <input 
                            type="text" 
                            id="spellingInput" 
                            placeholder="Type your spelling here..." 
                            autocomplete="off"
                            autocapitalize="off"
                            spellcheck="false"
                        >
                        <button id="submitBtn" class="submit-btn">Check</button>
                    </div>

                    <div id="feedback" class="feedback"></div>
                </div>

                <div class="controls">
                    <button id="skipBtn" class="control-btn skip-btn">Skip Word</button>
                    <button id="newGameBtn" class="control-btn new-game-btn">New Game</button>
                </div>
            </div>

            <div class="history-panel">
                <h3>Recent Words</h3>
                <ul id="historyList"></ul>
            </div>
        </main>

        <footer>
            <p>Use headphones for the best experience. Press Enter to submit your answer.</p>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
