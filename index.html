<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Math Adventure - Fun Math Game for Kids!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard', 'Marker Felt', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-container {
            background: linear-gradient(180deg, #fff9e6 0%, #ffe4b5 100%);
            border-radius: 30px;
            padding: 20px;
            max-width: 420px;
            width: 95%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .round-counter {
            background: #54a0ff;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .score {
            background: #5f27cd;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .animal-container {
            font-size: 80px;
            margin: 10px 0;
            animation: bounce 2s ease-in-out infinite;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .question {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .equation {
            font-size: 48px;
            font-weight: bold;
            color: #2d3436;
            margin: 10px 0;
        }

        .feedback {
            font-size: 28px;
            min-height: 40px;
            margin: 10px 0;
            font-weight: bold;
        }

        .feedback.correct {
            color: #00b894;
            animation: celebrate 0.5s ease-in-out;
        }

        .feedback.incorrect {
            color: #e74c3c;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .number-btn {
            background: linear-gradient(180deg, #ff9ff3 0%, #f368e0 100%);
            border: none;
            border-radius: 15px;
            padding: 18px 10px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #c44cae, 0 8px 15px rgba(0,0,0,0.2);
            touch-action: manipulation;
            user-select: none;
        }

        .number-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #c44cae, 0 4px 10px rgba(0,0,0,0.2);
        }

        .number-btn:nth-child(even) {
            background: linear-gradient(180deg, #48dbfb 0%, #0abde3 100%);
            box-shadow: 0 6px 0 #0a8fb0, 0 8px 15px rgba(0,0,0,0.2);
        }

        .number-btn:nth-child(even):active {
            box-shadow: 0 2px 0 #0a8fb0, 0 4px 10px rgba(0,0,0,0.2);
        }

        .number-btn:nth-child(3n) {
            background: linear-gradient(180deg, #feca57 0%, #f39c12 100%);
            box-shadow: 0 6px 0 #c77d0a, 0 8px 15px rgba(0,0,0,0.2);
        }

        .number-btn:nth-child(3n):active {
            box-shadow: 0 2px 0 #c77d0a, 0 4px 10px rgba(0,0,0,0.2);
        }

        .number-btn:nth-child(4n+1) {
            background: linear-gradient(180deg, #ff6b6b 0%, #ee5a5a 100%);
            box-shadow: 0 6px 0 #c44545, 0 8px 15px rgba(0,0,0,0.2);
        }

        .number-btn:nth-child(4n+1):active {
            box-shadow: 0 2px 0 #c44545, 0 4px 10px rgba(0,0,0,0.2);
        }

        .start-screen, .end-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        .title {
            font-size: 36px;
            color: #5f27cd;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #f9ca24;
        }

        .start-animal {
            font-size: 100px;
            margin: 20px 0;
            animation: bounce 1.5s ease-in-out infinite;
        }

        .start-btn, .restart-btn {
            background: linear-gradient(180deg, #00b894 0%, #00a085 100%);
            border: none;
            border-radius: 25px;
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #007b63, 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            touch-action: manipulation;
            margin-top: 20px;
        }

        .start-btn:active, .restart-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #007b63, 0 4px 10px rgba(0,0,0,0.2);
        }

        .trophy {
            font-size: 120px;
            margin: 20px 0;
            animation: trophy-bounce 1s ease-in-out infinite;
        }

        @keyframes trophy-bounce {
            0%, 100% { transform: scale(1) rotate(-5deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .final-score {
            font-size: 32px;
            color: #5f27cd;
            margin: 15px 0;
        }

        .stars {
            font-size: 40px;
            margin: 10px 0;
        }

        .message {
            font-size: 24px;
            color: #2d3436;
            margin: 10px 0;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: confetti-fall 3s ease-out forwards;
            pointer-events: none;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(500px) rotate(720deg);
                opacity: 0;
            }
        }

        .hidden {
            display: none !important;
        }

        /* Make buttons more accessible for small fingers */
        @media (max-height: 700px) {
            .animal-container {
                font-size: 60px;
                height: 70px;
            }
            .equation {
                font-size: 38px;
            }
            .number-btn {
                padding: 14px 8px;
                font-size: 24px;
            }
            .question {
                padding: 15px;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Start Screen -->
        <div id="startScreen" class="start-screen">
            <h1 class="title">🎮 Math Adventure!</h1>
            <div class="start-animal">🐰</div>
            <p class="message">Help the animals solve math problems!</p>
            <button class="start-btn" onclick="startGame()">Let's Play! 🎉</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="hidden">
            <div class="header">
                <div class="round-counter">Round <span id="currentRound">1</span>/12</div>
                <div class="score">⭐ <span id="score">0</span></div>
            </div>
            
            <div class="animal-container">
                <span id="animal">🐱</span>
            </div>
            
            <div class="question">
                <div class="equation" id="equation">5 + 3 = ?</div>
            </div>
            
            <div class="feedback" id="feedback"></div>
            
            <div class="number-grid" id="numberGrid">
                <!-- Number buttons will be generated here -->
            </div>
        </div>

        <!-- End Screen -->
        <div id="endScreen" class="hidden end-screen">
            <div class="trophy">🏆</div>
            <h2 class="title">Great Job!</h2>
            <div class="final-score">You got <span id="finalScore">0</span> out of 12!</div>
            <div class="stars" id="stars"></div>
            <p class="message" id="endMessage">Amazing work!</p>
            <button class="restart-btn" onclick="startGame()">Play Again! 🎮</button>
        </div>
    </div>

    <script>
        // Game state
        let currentRound = 0;
        let score = 0;
        let correctAnswer = 0;
        let isWaiting = false;
        const totalRounds = 12;

        // Adorable cartoon animals
        const animals = ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐨', '🦁', '🐸', '🐧', '🦋', '🐝'];

        // Audio context for sound effects
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'correct') {
                // Happy ascending arpeggio
                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
                oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.4);
            } else if (type === 'incorrect') {
                // Gentle descending tone
                oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(200, audioContext.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } else if (type === 'win') {
                // Victory fanfare
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.setValueAtTime(freq, audioContext.currentTime);
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.15 + 0.3);
                    osc.start(audioContext.currentTime + i * 0.15);
                    osc.stop(audioContext.currentTime + i * 0.15 + 0.3);
                });
            } else if (type === 'click') {
                // Button click sound
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.05);
            }
        }

        function vibrate(duration) {
            if ('vibrate' in navigator) {
                navigator.vibrate(duration);
            }
        }

        function generateQuestion() {
            // Use numbers 0-12
            const isAddition = Math.random() > 0.5;
            let num1, num2, answer;
            
            if (isAddition) {
                // For addition, ensure sum is 0-12
                num1 = Math.floor(Math.random() * 13);
                num2 = Math.floor(Math.random() * (13 - num1));
                answer = num1 + num2;
            } else {
                // For subtraction, ensure result is 0 or positive
                num1 = Math.floor(Math.random() * 13);
                num2 = Math.floor(Math.random() * (num1 + 1));
                answer = num1 - num2;
            }
            
            correctAnswer = answer;
            const operator = isAddition ? '+' : '−';
            document.getElementById('equation').textContent = `${num1} ${operator} ${num2} = ?`;
        }

        function createNumberButtons() {
            const grid = document.getElementById('numberGrid');
            grid.innerHTML = '';
            
            // Create buttons for 0-12
            for (let i = 0; i <= 12; i++) {
                const btn = document.createElement('button');
                btn.className = 'number-btn';
                btn.textContent = i;
                btn.onclick = () => checkAnswer(i);
                grid.appendChild(btn);
            }
        }

        function updateAnimal() {
            const animal = animals[currentRound % animals.length];
            document.getElementById('animal').textContent = animal;
        }

        function checkAnswer(selectedNumber) {
            if (isWaiting) return;
            
            initAudio();
            playSound('click');
            
            const feedback = document.getElementById('feedback');
            
            if (selectedNumber === correctAnswer) {
                score++;
                feedback.textContent = '✨ Correct! Great job! ✨';
                feedback.className = 'feedback correct';
                playSound('correct');
                vibrate(100); // Short vibration on correct answer
                document.getElementById('score').textContent = score;
            } else {
                feedback.textContent = `Oops! It was ${correctAnswer}`;
                feedback.className = 'feedback incorrect';
                playSound('incorrect');
            }
            
            isWaiting = true;
            
            setTimeout(() => {
                currentRound++;
                
                if (currentRound >= totalRounds) {
                    endGame();
                } else {
                    nextQuestion();
                }
                
                isWaiting = false;
            }, 1500);
        }

        function nextQuestion() {
            document.getElementById('currentRound').textContent = currentRound + 1;
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            updateAnimal();
            generateQuestion();
        }

        function startGame() {
            initAudio();
            currentRound = 0;
            score = 0;
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            document.getElementById('score').textContent = '0';
            createNumberButtons();
            nextQuestion();
        }

        function createConfetti() {
            const container = document.querySelector('.game-container');
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#00b894'];
            const confettiElements = [];
            
            // Reduce confetti count for better performance
            const confettiCount = 30;
            
            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(confetti);
                confettiElements.push(confetti);
            }
            
            // Clean up all confetti at once after animation completes
            setTimeout(() => {
                confettiElements.forEach(el => el.remove());
            }, 5000);
        }

        function endGame() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');
            
            document.getElementById('finalScore').textContent = score;
            
            // Generate stars based on score - always show at least 1 star to encourage children
            const starsContainer = document.getElementById('stars');
            const starCount = Math.max(1, Math.ceil(score / 4)); // 1-3 stars based on performance
            starsContainer.textContent = '⭐'.repeat(Math.min(starCount, 3));
            
            // Set encouraging message
            const message = document.getElementById('endMessage');
            if (score === 12) {
                message.textContent = "PERFECT! You're a math superstar! 🌟";
            } else if (score >= 10) {
                message.textContent = "Amazing work! You're so smart! 🎉";
            } else if (score >= 7) {
                message.textContent = "Great job! Keep practicing! 💪";
            } else if (score >= 4) {
                message.textContent = "Good try! You're learning! 📚";
            } else {
                message.textContent = "Nice effort! Practice makes perfect! 🌈";
            }
            
            playSound('win');
            createConfetti();
        }

        // Note: touch-action: manipulation on buttons handles double-tap zoom prevention
        // No additional touchend handlers needed - they can interfere with click events on some browsers
    </script>
</body>
</html>
